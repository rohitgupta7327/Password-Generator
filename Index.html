<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1>Password Generator</h1>
      <div class="password-container">
        <!-- password container -->
        <input
          type="text"
          placeholder="password will appear here"
          readonly
          id="password"
        />
        <i class="far fa-copy" id="copy-btn" title="Copy to clipboard"></i>
      </div>
 

     <!--options-->
     <div class="options">
      <!--Password Length-->
      <div class="option">
        <label for="length">Password Length</label>
        <div class="range-container">
          <input type="range" id="length" min="4" max="24" value="12" />
          <span id="length-value">12</span>
        </div>
      </div>
      <!--Uppercase Letters-->
      <div class="option">
        <label for="uppercase">Include Uppercase</label>
            <input type = "checkbox" id="uppercase" checked/> 
      </div>
       <div class="option">
        <label for="lowercase">Include Lowercase</label>
            <input type = "checkbox" id="lowercase" checked/> 
      </div>
       <div class="option">
        <label for="numbers">Include Numbers</label>
            <input type = "checkbox" id="numbers" checked/> 
      </div>
       <div class="option">
        <label for="symbols">Include Symbols</label>
            <input type = "checkbox" id="symbols" checked/> 
      </div>
     </div>

     <button id="generate-btn">
        <i class="fas fa-key"></i>
     Generate Password</button>

     <div class="strength-container">
        <p>Password Strength: <span id="strength-label">Medium</span></p>
        
        <div class="strength-meter">
        <div id="strength-bar"></div>
     </div>
     </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
